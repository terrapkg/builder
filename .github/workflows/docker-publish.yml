name: Docker Publish
permissions:
  contents: read
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0/2 * * *"
  push:
    branches: ["frawhide", "f45", "f44", "f43", "el10", "tumbleweed", "frawhide-staging"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        branch: ["rawhide", "45", "44", "43", "el10", "tumbleweed", "rawhide-staging"]
    uses: ./.github/workflows/docker.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      publish: ${{ github.event_name != 'pull_request' }}
      ref: ${{ !startsWith(matrix.branch, 'el') && (matrix.branch != 'tumbleweed') && 'f' || '' }}${{ matrix.branch }}
      artifact_name: digests-${{ matrix.branch }}
      tags: |
        type=raw,value=${{ !startsWith(matrix.branch, 'el') && (matrix.branch != 'tumbleweed') && 'f' || '' }}${{ matrix.branch }}
        type=schedule,pattern=${{ !startsWith(matrix.branch, 'el') && (matrix.branch != 'tumbleweed') && 'f' || '' }}${{ matrix.branch }}-{{date 'X'}}
        type=schedule,pattern=nightly-{{date 'X'}}
