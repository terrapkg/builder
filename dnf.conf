[main]
keepcache=1
retries=20
gpgcheck=1
install_weak_deps=0
metadata_expire=-1
best=1
tsflags=nodocs
max_parallel_downloads=20
reposdir=/dev/null

[staging-terra]
name=Terra $releasever Staging
baseurl=https://kiritanpo-objects.fyralabs.com/staging-terra$releasever
metadata_expire=0
type=rpm
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-staging-terra$releasever
repo_gpgcheck=1
enabled=1
enabled_metadata=1

[staging-terra-extras]
name=Terra $releasever (Extras) Staging
baseurl=https://kiritanpo-objects.fyralabs.com/staging-terra$releasever-extras
metadata_expire=0
type=rpm
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-staging-terra$releasever-extras
repo_gpgcheck=1
enabled=1
enabled_metadata=1
priority=150

[staging-terra-nvidia]
name=Terra $releasever (NVIDIA) Staging
baseurl=https://kiritanpo-objects.fyralabs.com/staging-terra$releasever-nvidia
metadata_expire=0
type=rpm
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-staging-terra$releasever-nvidia
repo_gpgcheck=1
enabled=0
enabled_metadata=1
priority=80
excludepkgs=dkms-nvidia*

[staging-terra-mesa]
name=Terra $releasever (Mesa) Staging
baseurl=https://kiritanpo-objects.fyralabs.com/terra$releasever-mesa
type=rpm
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-staging-terra$releasever-mesa
repo_gpgcheck=1
enabled=0
enabled_metadata=1
priority=80

[staging-terra-multimedia]
name=Terra $releasever (Multimedia) Staging
baseurl=https://kiritanpo-objects.fyralabs.com/terra$releasever-multimedia
type=rpm
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-staging-terra$releasever-multimedia
repo_gpgcheck=1
enabled=0
enabled_metadata=1
priority=80

[fedora]
name=Fedora $releasever - $basearch
metalink=https://mirrors.fedoraproject.org/metalink?repo=fedora-$releasever&arch=$basearch
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-fedora-$releasever-$basearch
skip_if_unavailable=False

[updates]
name=updates
metalink=https://mirrors.fedoraproject.org/metalink?repo=updates-released-f$releasever&arch=$basearch
gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-fedora-$releasever-$basearch
skip_if_unavailable=False

[adoptium-temurin-java-repository]
name=Adoptium
baseurl=https://packages.adoptium.net/artifactory/rpm/fedora/$releasever/$basearch
enabled=1
gpgkey=https://packages.adoptium.net/artifactory/api/gpg/key/public
enabled_metadata=1
